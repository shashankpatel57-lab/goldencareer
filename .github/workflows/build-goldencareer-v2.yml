name: Build Golden Career v2 APK

on:
  push:
    branches: [ "goldencareer-v2-build" ]
    paths:
      - "v2-overlay/**"
      - "v2-overlay-chunks/**"
      - ".github/workflows/build-goldencareer-v2.yml"
      - "V2_BUILD_TRIGGER.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Golden Career v2 source
        run: |
          rm -rf android-src
          mkdir android-src
          unzip -q goldencareer-android-source-v1.0.1.zip -d android-src
          cp -a v2-overlay/. android-src/
          cat v2-overlay-chunks/GoldenCareerApp.part* > android-src/app/src/main/java/com/goldencareer/app/ui/GoldenCareerApp.kt
          test -f android-src/settings.gradle.kts
          test -f android-src/app/build.gradle.kts
          grep -q 'versionName = "2.0.0"' android-src/app/build.gradle.kts

      - name: Build debug APK and release AAB
        working-directory: android-src
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Rename outputs
        run: |
          cp android-src/app/build/outputs/apk/debug/app-debug.apk GoldenCareer-v2.0.0.apk
          cp android-src/app/build/outputs/bundle/release/app-release.aab GoldenCareer-v2.0.0.aab
          sha256sum GoldenCareer-v2.0.0.apk GoldenCareer-v2.0.0.aab > SHA256SUMS-v2.0.0.txt

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCareer-v2.0.0-build
          if-no-files-found: error
          retention-days: 30
          path: |
            GoldenCareer-v2.0.0.apk
            GoldenCareer-v2.0.0.aab
            SHA256SUMS-v2.0.0.txt
