name: Build Golden Career v3 APK

on:
  push:
    branches: [ "goldencareer-v3-build" ]
    paths:
      - "v3-source-parts/**"
      - ".github/workflows/build-goldencareer-v3.yml"
      - "V3_BUILD_TRIGGER.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Golden Career v3 source
        run: |
          cat v3-source-parts/part*.b64 > source.b64
          test "$(wc -c < source.b64)" = "49176"
          base64 -d source.b64 > goldencareer-android-source-v3.0.0.zip
          echo "73442eadb70df178ee69393572cfb290a2b29b94a6149aae8fb11a97c770bc9b  goldencareer-android-source-v3.0.0.zip" | sha256sum -c -
          rm -rf android-src
          mkdir android-src
          unzip -q goldencareer-android-source-v3.0.0.zip -d android-src
          test -f android-src/settings.gradle.kts
          test -f android-src/app/build.gradle.kts
          grep -q 'versionName = "3.0.0"' android-src/app/build.gradle.kts

      - name: Build installable APK
        working-directory: android-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp android-src/app/build/outputs/apk/debug/app-debug.apk GoldenCareer-v3.0.0.apk
          sha256sum GoldenCareer-v3.0.0.apk > SHA256SUMS-v3.0.0.txt
          ls -lh GoldenCareer-v3.0.0.apk

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCareer-v3.0.0-build
          if-no-files-found: error
          retention-days: 30
          path: |
            GoldenCareer-v3.0.0.apk
            SHA256SUMS-v3.0.0.txt
