name: Build Baby Monitor V3 APK
on:
  push:
    branches: [ baby-monitor-build ]
    paths:
      - 'baby_monitor_v3_payload/**'
      - '.github/workflows/build-baby-monitor-v3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and validate V3 source
        shell: bash
        run: |
          cat baby_monitor_v3_payload/part00.b64 baby_monitor_v3_payload/part01.b64 baby_monitor_v3_payload/part02.b64 baby_monitor_v3_payload/part03.b64 > /tmp/BabyMonitorV3_Source.zip.b64
          base64 -d /tmp/BabyMonitorV3_Source.zip.b64 > /tmp/BabyMonitorV3_Source.zip
          echo 'db8377f0bd45f2edde79a0d5a074a7d030d9ded1f0f116c61ebb0aa3d06dc02c  /tmp/BabyMonitorV3_Source.zip' | sha256sum -c -
          unzip -t /tmp/BabyMonitorV3_Source.zip
          rm -rf /tmp/bm3
          mkdir -p /tmp/bm3
          unzip -q /tmp/BabyMonitorV3_Source.zip -d /tmp/bm3
          grep -q "versionName '3.0.0'" /tmp/bm3/BabyMonitorV2/app/build.gradle
          test -s /tmp/bm3/BabyMonitorV2/app/src/main/java/com/babymonitor/privateapp/AudioRouting.java
          ls -la /tmp/bm3/BabyMonitorV2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build private V3 release APK
        working-directory: /tmp/bm3/BabyMonitorV2
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK and source package
        shell: bash
        run: |
          APK=/tmp/bm3/BabyMonitorV2/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/35.* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee /tmp/BabyMonitor_Private_v3.0.0.apk.sha256
          cp "$APK" /tmp/BabyMonitor_Private_v3.0.0.apk
          cd /tmp/bm3 && zip -qr /tmp/BabyMonitor_Private_Source_v3.0.0.zip BabyMonitorV2
          unzip -t /tmp/BabyMonitor_Private_Source_v3.0.0.zip

      - name: Upload V3 install package
        uses: actions/upload-artifact@v4
        with:
          name: BabyMonitor-Private-v3.0.0
          path: |
            /tmp/BabyMonitor_Private_v3.0.0.apk
            /tmp/BabyMonitor_Private_v3.0.0.apk.sha256
            /tmp/BabyMonitor_Private_Source_v3.0.0.zip
          if-no-files-found: error
