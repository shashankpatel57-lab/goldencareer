name: Build Baby Monitor Private APK

on:
  push:
    branches: [ baby-monitor-build ]
    paths:
      - '.github/workflows/build-baby-monitor-private.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact source package
        shell: bash
        run: |
          cat baby_src_chunks2/p00 baby_src_chunks2/p01 baby_src_chunks2/p02 baby_src_chunks2/p03 baby_src_chunks2/p04 baby_src_chunks2/p05 baby_src_chunks2/p06 baby_src_chunks2/p07 baby_src_chunks2/p08 baby_src_chunks2/p09 baby_src_chunks2/p10 baby_src_chunks2/p11 baby_src_chunks2/p12 | base64 -d > BabyMonitor_Private_Source_v1.0.0.zip
          unzip -q BabyMonitor_Private_Source_v1.0.0.zip
          test -f babymonitor_project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build private release APK
        working-directory: babymonitor_project
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK='babymonitor_project/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          cp "$APK" BabyMonitor_Private_v1.0.0.apk
          sha256sum BabyMonitor_Private_v1.0.0.apk > BabyMonitor_Private_v1.0.0.apk.sha256

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: BabyMonitor-Private-v1.0.0
          path: |
            BabyMonitor_Private_v1.0.0.apk
            BabyMonitor_Private_v1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
