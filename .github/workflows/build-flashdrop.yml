name: Build FlashDrop APK

on:
  push:
    branches:
      - chatgpt-flashdrop-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Preserve direct-transfer patch
        shell: bash
        run: |
          mkdir -p /tmp/flashdrop-patch
          cp tools/flashdrop/app/src/main/java/in/flashdrop/lan/FileServerService.java /tmp/flashdrop-patch/
          cp tools/flashdrop/app/src/main/java/in/flashdrop/lan/MainActivity.java /tmp/flashdrop-patch/
          cp tools/flashdrop/app/src/main/java/in/flashdrop/lan/FtpFileServer.java /tmp/flashdrop-patch/

      - name: Restore base FlashDrop source snapshot
        shell: bash
        run: |
          cat .flashdrop/src.b64.* | tr -d '\n\r ' | base64 -d > /tmp/flashdrop-src.zip
          echo "55354f1e7987b3051b2fcdba1985fb18ab7f2062820a90299222f236b3f7e1ab  /tmp/flashdrop-src.zip" | sha256sum -c -
          unzip -o /tmp/flashdrop-src.zip -d .

      - name: Apply direct Windows Explorer mode
        shell: bash
        run: |
          cp /tmp/flashdrop-patch/FileServerService.java tools/flashdrop/app/src/main/java/in/flashdrop/lan/
          cp /tmp/flashdrop-patch/MainActivity.java tools/flashdrop/app/src/main/java/in/flashdrop/lan/
          cp /tmp/flashdrop-patch/FtpFileServer.java tools/flashdrop/app/src/main/java/in/flashdrop/lan/
          sed -i "s/versionCode 1/versionCode 2/" tools/flashdrop/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.1.0'/" tools/flashdrop/app/build.gradle
          sed -i 's/android:label="FlashDrop LAN"/android:label="FlashDrop Direct"/' tools/flashdrop/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: tools/flashdrop
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          cp tools/flashdrop/app/build/outputs/apk/debug/app-debug.apk FlashDrop-Direct-v1.1.apk
          sha256sum FlashDrop-Direct-v1.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashDrop-Direct-APK
          path: FlashDrop-Direct-v1.1.apk
          if-no-files-found: error
          retention-days: 7
