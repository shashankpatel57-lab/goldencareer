name: Build BharatDrop v5.0 Release

on:
  push:
    branches:
      - chatgpt-flashdrop-build

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble BharatDrop Desktop source
        shell: powershell
        run: |
          $parts = Get-ChildItem ".flashdrop/windows/FlashDropTurbo.cs.*" | Sort-Object Name
          $out = New-Object System.IO.StreamWriter("BharatDropDesktop.cs", $false, (New-Object System.Text.UTF8Encoding($false)))
          foreach ($p in $parts) { $out.Write([System.IO.File]::ReadAllText($p.FullName)) }
          $out.Close()
          Write-Host "Source bytes:" (Get-Item BharatDropDesktop.cs).Length

      - name: Compile BharatDrop Desktop
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "C# compiler not found: $csc" }
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu /out:BharatDropDesktop.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll BharatDropDesktop.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash BharatDropDesktop.exe -Algorithm SHA256
          Write-Host "EXE bytes:" (Get-Item BharatDropDesktop.exe).Length

      - name: Upload BharatDrop Desktop
        uses: actions/upload-artifact@v4
        with:
          name: BharatDrop-Desktop-Windows
          path: BharatDropDesktop.exe
          if-no-files-found: error
          retention-days: 7

  android-release:
    needs: windows-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download BharatDrop Desktop into Android assets
        uses: actions/download-artifact@v4
        with:
          name: BharatDrop-Desktop-Windows
          path: /tmp/bharatdrop-desktop

      - name: Embed desktop helper
        shell: bash
        run: |
          mkdir -p tools/flashdrop/app/src/main/assets
          cp /tmp/bharatdrop-desktop/BharatDropDesktop.exe tools/flashdrop/app/src/main/assets/FlashDropTurbo.exe
          test -s tools/flashdrop/app/src/main/assets/FlashDropTurbo.exe
          sha256sum tools/flashdrop/app/src/main/assets/FlashDropTurbo.exe

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Android 16 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK and AAB
        working-directory: tools/flashdrop
        shell: bash
        run: |
          gradle :app:clean :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Stage unsigned release for final signing
        shell: bash
        run: |
          mkdir -p release
          cp tools/flashdrop/app/build/outputs/apk/release/app-release-unsigned.apk release/BharatDrop-v5.0.0-unsigned.apk
          cp tools/flashdrop/app/build/outputs/bundle/release/app-release.aab release/BharatDrop-v5.0.0-unsigned.aab
          cp /tmp/bharatdrop-desktop/BharatDropDesktop.exe release/BharatDropDesktop-v5.0.exe
          cp tools/flashdrop/PLAY_STORE_PRIVACY_POLICY.html release/Privacy-Policy.html
          cp tools/flashdrop/PLAY_STORE_LISTING.md release/Play-Store-Listing.md
          cp tools/flashdrop/MANAGE_EXTERNAL_STORAGE_DECLARATION.md release/All-Files-Access-Declaration.md
          sha256sum release/*

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: BharatDrop-v5.0.0-Release
          path: release/
          if-no-files-found: error
          retention-days: 7
