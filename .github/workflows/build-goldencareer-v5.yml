name: Build Golden Career v5.0.2 APK
on:
  push:
    branches: [goldencareer-v5-build]
    paths:
      - 'v5-source-parts/**'
      - '.github/workflows/build-goldencareer-v5.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore verified Golden Career v5.0.2 source
        run: |
          cat v5-source-parts/part*.b64 > source.b64
          test "$(wc -c < source.b64)" = "56588"
          base64 -d source.b64 > source.zip
          echo "f7e889a5789c892c9d31c2576c8fb5a582bcec078297ca1afb0f318a0220c1d1  source.zip" | sha256sum -c -
          rm -rf android-src
          mkdir android-src
          unzip -q source.zip -d android-src
          test -f android-src/settings.gradle.kts
          test -f android-src/app/build.gradle.kts
          grep -q 'versionName = "5.0.2"' android-src/app/build.gradle.kts
          grep -q 'versionCode = 8' android-src/app/build.gradle.kts
      - name: Build installable APK
        run: |
          cd android-src
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp android-src/app/build/outputs/apk/debug/app-debug.apk artifact/GoldenCareer-v5.0.2.apk
          sha256sum artifact/GoldenCareer-v5.0.2.apk > artifact/SHA256SUMS.txt
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCareer-v5.0.2-build
          path: artifact/*
          if-no-files-found: error
