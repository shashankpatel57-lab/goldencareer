name: Build Golden Career v4 APK
on:
  push:
    branches: [goldencareer-v4-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore source
        run: |
          rm -rf android-src
          mkdir android-src
          unzip -q goldencareer-android-source-v4.0.0.zip -d android-src
          test -f android-src/settings.gradle.kts
          grep -q 'versionName = "4.0.0"' android-src/app/build.gradle.kts
      - name: Build installable APK
        run: |
          cd android-src
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp android-src/app/build/outputs/apk/debug/app-debug.apk artifact/GoldenCareer-v4.0.0.apk
          sha256sum artifact/GoldenCareer-v4.0.0.apk > artifact/SHA256SUMS.txt
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCareer-v4.0.0-build
          path: artifact/*
          if-no-files-found: error
