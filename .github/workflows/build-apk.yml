name: Build Golden Career APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack Golden Career Android source
        run: |
          rm -rf android-src
          mkdir android-src
          unzip -q goldencareer-android-source-v1.0.1.zip -d android-src
          test -f android-src/settings.gradle.kts
          test -f android-src/app/build.gradle.kts

      - name: Build debug APK and release AAB
        working-directory: android-src
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Rename outputs
        run: |
          cp android-src/app/build/outputs/apk/debug/app-debug.apk GoldenCareer-v1.0.1.apk
          cp android-src/app/build/outputs/bundle/release/app-release.aab GoldenCareer-v1.0.1.aab

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCareer-v1.0.1-build
          if-no-files-found: error
          path: |
            GoldenCareer-v1.0.1.apk
            GoldenCareer-v1.0.1.aab
